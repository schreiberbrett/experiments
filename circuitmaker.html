<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean Function Minimizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-family: monospace;
        }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            background: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<h1>Boolean Function Minimizer</h1>

<p>Define your boolean function f(x) where x is an 8-bit input (e.g., <code>return (x & 1) && !(x & 2);</code>):</p>
<textarea id="functionInput">return (x & 1) && !(x & 2);</textarea>
<br><br>
<button id="goButton">GO</button>

<h2>Optimized Circuit (Graphviz)</h2>
<div id="output"></div>

<script>
    document.getElementById('goButton').addEventListener('click', () => {
        const funcInput = document.getElementById('functionInput').value;
        const outputDiv = document.getElementById('output');

        // Define the boolean function based on user input
        let func;
        try {
            func = new Function('x', funcInput);
        } catch (error) {
            outputDiv.textContent = 'Error: Invalid function syntax.';
            return;
        }

        // Evaluate the function on inputs from 0 to 255 and create a truth table
        const truthTable = [];
        for (let x = 0; x < 32; x++) {
            try {
                const result = func(x) ? 1 : 0;
                truthTable.push({ input: x, output: result });
            } catch (error) {
                outputDiv.textContent = 'Error during function evaluation.';
                return;
            }
        }

        // Filter minterms where the output is 1
        const minterms = truthTable
            .filter(entry => entry.output === 1)
            .map(entry => decimalToBinary(entry.input, 8));

        // Minimize the truth table using a basic logic minimization algorithm
        const minimizedExpression = minimizeLogic(minterms);

        // Display the minimized expression as Graphviz markup
        const graphvizMarkup = generateGraphviz(minimizedExpression);
        outputDiv.textContent = graphvizMarkup;
    });

    // Convert decimal to binary with padding
    function decimalToBinary(num, bits) {
        return num.toString(2).padStart(bits, '0');
    }

    // Basic Quine-McCluskey minimization algorithm implementation
    function minimizeLogic(minterms) {
        // Step 1: Group minterms by the number of 1's in them
        let groups = {};
        minterms.forEach(minterm => {
            const onesCount = minterm.split('1').length - 1;
            if (!groups[onesCount]) groups[onesCount] = [];
            groups[onesCount].push(minterm);
        });

        // Step 2: Merge minterms to find prime implicants
        let primeImplicants = [];
        let merged = true;

        while (merged) {
            merged = false;
            const newGroups = {};

            for (let group in groups) {
                const currentGroup = groups[group];
                const nextGroup = groups[parseInt(group) + 1] || [];
                const marked = Array(currentGroup.length).fill(false);
                const nextMarked = Array(nextGroup.length).fill(false);

                for (let i = 0; i < currentGroup.length; i++) {
                    for (let j = 0; j < nextGroup.length; j++) {
                        const diffIndex = findDiffIndex(currentGroup[i], nextGroup[j]);
                        if (diffIndex !== -1) {
                            const newTerm = replaceAt(currentGroup[i], diffIndex, '-');
                            if (!newGroups[group]) newGroups[group] = [];
                            newGroups[group].push(newTerm);
                            marked[i] = true;
                            nextMarked[j] = true;
                            merged = true;
                        }
                    }
                }

                // Add unmarked terms as prime implicants
                for (let i = 0; i < marked.length; i++) {
                    if (!marked[i]) primeImplicants.push(currentGroup[i]);
                }
                for (let j = 0; j < nextMarked.length; j++) {
                    if (!nextMarked[j]) primeImplicants.push(nextGroup[j]);
                }
            }
            groups = newGroups;
        }

        // Step 3: Remove duplicates
        primeImplicants = [...new Set(primeImplicants)];
        return primeImplicants;
    }

    // Find the index of differing bit between two binary strings, or -1 if more than one difference
    function findDiffIndex(a, b) {
        let diffIndex = -1;
        for (let i = 0; i < a.length; i++) {
            if (a[i] !== b[i]) {
                if (diffIndex === -1) diffIndex = i;
                else return -1; // More than one difference
            }
        }
        return diffIndex;
    }

    // Replace a character at a specific index
    function replaceAt(str, index, char) {
        return str.substring(0, index) + char + str.substring(index + 1);
    }

    // Function to generate Graphviz markup from minimized expression
    function generateGraphviz(implicants) {
        let graphviz = 'digraph G {\n';
        graphviz += '  rankdir=LR;\n';
        graphviz += '  node [shape=box];\n';
        implicants.forEach((implicant, index) => {
            graphviz += `  term${index} [label="${implicant.replace(/-/g, 'X')}"];\n`;
        });
        graphviz += '}\n';
        return graphviz;
    }
</script>

</body>
</html>
