/*
N-Queens algorithm base case:
-----------------------------
As a base case, suppose we are given an NxN chessboard and zero queens to
place. Then the algorithm can simply return "true", because no more queens
need to be placed on the given chessboard.

N-Queens algorithm recursive case:
----------------------------------
Suppose now we are asked to place k queens on the chessboard for some k > 0.
First, consider all the available squares a queen can be placed. That, is
compute the set of squares that are not attacked by any queens that have
already been placed. If this set is empty, then return "false", because no more
queens can be placed on the chessboard.

Otherwise, when the set of available squ,ares is nonempty, then choose one and
place a queen there. Recur on the current chessboard with k-1 queens. This
recursive call will either suceed with "true" or fail with "false". If it
succeeds, it will leave the chessboard with k queens placed on it, so we can
succeed, too. If it fails, then place the queen on another available square and
recur again. As above, if we run out of available squares, then there is no way to
place the k queens on the chessboard, so return "false".

More can be said about how exactly to compute the set of available tiles. For
one, each column of the chessboard will hold exactly one queen, so the algorithm
can avoid work by only considering that column's available squares. So too will
there be shortcuts for the analogous recursive backtracking algorithm for
computing a graph's crossing number.

Now we turn our attention to describing the recursive backtracking algorithm
for computing a graph's crossing number (and additionally displaying its steps
and solution). The task is to place n vertices on an n*n grid in such a way
that minimizes the number of edge crossings. Thus although the task is similar
in that there are N objects that are placed within N*N points, in this case a
minimual solution is desired rather than simply a valid placement.

there are no vertices left to place. The algorithm can halt with the current

by computing every place that first unplaced vertex can go, since of course two
vertices should not occupy the same point. Additionally, a vertex should never
occupy a point which causes two (colinear) line segments to overlap. A vertex
should also be disqualified if adding it creates more crossings than the
minimum seen so far.
